<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مغامرة فاطمة العسل مع الضمّة 🍯</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(#bfe9ff,#fff6c9 60%,#ffe08a);min-height:100vh;color:#5a3a00;text-align:center;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;font-size:34px;z-index:0}
.bg span{position:absolute;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-22px) rotate(8deg)}}
header{position:sticky;top:0;z-index:5;background:#ff9f1c;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:20px;box-shadow:0 3px 8px #0003}
header button{background:#fff;color:#c26a00;border:0;border-radius:20px;padding:6px 14px;font-size:16px;font-weight:bold;cursor:pointer}
main{position:relative;z-index:1;max-width:900px;margin:auto;padding:14px}
h1{font-size:34px;margin:8px 0}
.fat{font-size:70px;animation:fl 3s infinite}
.menu{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.lv{background:#fff;border:4px solid #ffb703;border-radius:24px;padding:16px;width:250px;cursor:pointer;box-shadow:0 6px 0 #e09100;transition:.2s}
.lv:hover{transform:translateY(-4px)}
.lv .ic{font-size:50px}.lv h3{margin:6px 0;font-size:22px}.lv p{margin:0;font-size:15px}
.lv.done{background:#e8ffd9;border-color:#52b788}
.say{background:#fff;border-radius:20px;padding:10px 16px;display:inline-block;font-size:20px;margin:8px 0;border:3px dashed #ffb703}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.drop{min-width:92px;min-height:92px;border:4px dashed #ff9f1c;border-radius:20px;background:#fffbe6;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:40px;font-weight:bold;transition:.2s}
.drop small{font-size:18px}
.drop.ok{background:#b7f5a8;border:4px solid #52b788}
.drop.hot{background:#ffe8a0}
.tray{min-height:100px;border:3px solid #ffd166;border-radius:22px;background:#ffffff99;padding:10px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.card{background:linear-gradient(#ffd54a,#ffb703);border-radius:18px;padding:10px 18px;font-size:38px;font-weight:bold;cursor:grab;box-shadow:0 5px 0 #c98600;touch-action:none;min-width:70px}
.card.w{font-size:30px}
.card.lift{opacity:.3}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-6deg) scale(1.1);opacity:.95}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pic{font-size:90px;animation:fl 3s infinite}
.slots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.slots .drop{min-width:100px;min-height:100px}
.btn{background:#52b788;color:#fff;border:0;border-radius:30px;padding:12px 30px;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #2d8a5f;margin:10px}
.bar{height:18px;background:#fff;border-radius:10px;border:2px solid #ffb703;overflow:hidden;margin:6px auto;max-width:400px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,#ff7b00);transition:.4s}
.modal{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:center;justify-content:center}
.modal div{background:#fff;border-radius:30px;padding:26px;max-width:380px;border:6px solid #ffb703}
.modal h2{font-size:30px;margin:0 0 8px}
.conf{position:fixed;top:-40px;font-size:30px;z-index:60;pointer-events:none;animation:fall 2.5s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
footer{position:relative;z-index:1;padding:14px;font-size:15px;opacity:.8}
</style>
</head>
<body>
<div class="bg"><span style="top:12%;right:6%">🐝</span><span style="top:30%;left:5%">🌸</span><span style="top:60%;right:4%">🍯</span><span style="top:75%;left:8%">🐝</span></div>
<header><span>🍯 <span id="sc">0</span> نقطة</span><span>مغامرة فاطمة العسل</span><button onclick="menu()">🏠 المراحل</button></header>
<main id="st"></main>
<footer>Created by T. Badria Alfalahi</footer>
<script>
const $=s=>document.querySelector(s),st=$('#st');
let score=0,done={};
const add=n=>{score+=n;$('#sc').textContent=score};
const shuf=a=>[...a].sort(()=>Math.random()-.5);
function drag(el,cb){
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();const r=el.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);el.classList.add('lift');
  const mv=ev=>{g.style.left=ev.clientX-dx+'px';g.style.top=ev.clientY-dy+'px';document.querySelectorAll('.hot').forEach(h=>h.classList.remove('hot'));const t=document.elementFromPoint(ev.clientX,ev.clientY);t&&t.closest('.drop')&&t.closest('.drop').classList.add('hot')};
  mv(e);
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
   g.remove();el.classList.remove('lift');document.querySelectorAll('.hot').forEach(h=>h.classList.remove('hot'));
   const t=document.elementFromPoint(ev.clientX,ev.clientY);cb(el,t&&t.closest('.drop'))};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
 });
}
const bad=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
function confetti(){for(let i=0;i<30;i++){const c=document.createElement('div');c.className='conf';c.textContent=['🍯','🐝','⭐','🌸','🎉'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
function win(n,msg){
 done[n]=1;confetti();
 const m=document.createElement('div');m.className='modal';
 const all=Object.keys(done).length==3;
 m.innerHTML=`<div><div style="font-size:70px">${all?'🏆':'🍯'}</div><h2>${all?'أحسنتِ يا فاطمة العسل!':'أحسنتِ يا فاطمة!'}</h2><p style="font-size:20px">${all?'أنهيتِ كل المراحل وملأتِ جرّة العسل! أنتِ بطلة الضمّة 🐝':msg}</p><button class="btn">${all?'العودة للقائمة':'اختاري مرحلة أخرى'}</button></div>`;
 document.body.appendChild(m);m.querySelector('button').onclick=()=>{m.remove();menu()};
}
function menu(){
 const L=[[1,'🐝','المرحلة ١: خلية الحروف','ضعي كل حرف مضموم عند حرفه'],[2,'🧩','المرحلة ٢: ركّبي الكلمة','رتّبي المقاطع لتكوين كلمة'],[3,'🧺','المرحلة ٣: سلّتا العسل','ميّزي الكلمات المبدوءة بضمّة']];
 const p=Object.keys(done).length;
 st.innerHTML=`<div class="fat">👧🍯</div><h1>مغامرة فاطمة العسل مع الضمّة</h1><div class="say">ساعدي النحلة 🐝 في جمع العسل! اختاري أي مرحلة تبدئين بها</div><div class="bar"><i style="width:${p/3*100}%"></i></div><div class="menu">${L.map(l=>`<div class="lv ${done[l[0]]?'done':''}" onclick="go(${l[0]})"><div class="ic">${done[l[0]]?'✅':l[1]}</div><h3>${l[2]}</h3><p>${l[3]}</p></div>`).join('')}</div>`;
}
function go(n){[0,L1,L2,L3][n]()}
/* المرحلة 1 */
function L1(){
 const P=[['أ','أُ'],['ب','بُ'],['ت','تُ'],['ث','ثُ'],['ج','جُ'],['ح','حُ'],['خ','خُ'],['د','دُ']];let n=0;
 st.innerHTML=`<h1>🐝 خلية الحروف</h1><div class="say">اسحبي الحرف المضموم إلى خليّته</div><div class="row">${P.map(p=>`<div class="drop" data-k="${p[0]}">${p[0]}<small>🍯</small></div>`).join('')}</div><div class="tray" id="tr">${shuf(P).map(p=>`<div class="card" data-k="${p[0]}">${p[1]}</div>`).join('')}</div>`;
 document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
  if(d&&d.dataset.k&&!d.classList.contains('ok')&&d.dataset.k===el.dataset.k){d.classList.add('ok');d.innerHTML=el.textContent+'<small>🍯✔</small>';el.remove();add(10);if(++n==P.length)setTimeout(()=>win(1,'ملأتِ كل خلايا النحل بالعسل!'),400)}
  else{bad(el);add(-1<0&&score>0?-1:0)}
 }));
}
/* المرحلة 2 */
function L2(){
 const W=[['زُ','رِ','عَ','🌱','ما الذي حدث للبذور؟'],['أُ','كِ','لَ','🍎','التفاحة...'],['شُ','رِ','بَ','🥛','الحليب...'],['كُ','تِ','بَ','✍️','الدرس...'],['رُ','سِ','مَ','🎨','الرسم...'],['حُ','مِ','دَ','🙏','الله...'],['رُ','حِ','مَ','💗','الضعيف...'],['شُ','رِ','حَ','👩‍🏫','الدرس...']];
 let i=0;
 function show(){
  const w=W[i],parts=w.slice(0,3);
  st.innerHTML=`<h1>🧩 ركّبي الكلمة</h1><div class="bar"><i style="width:${i/W.length*100}%"></i></div><div class="pic">${w[3]}</div><div class="say">اسحبي المقاطع بالترتيب لتكوين الكلمة (${i+1}/${W.length})</div><div class="slots">${[0,1,2].map(()=>'<div class="drop sl"></div>').join('')}</div><div class="tray drop" id="tr">${shuf(parts.map((p,k)=>[p,k])).map(x=>`<div class="card" data-i="${x[1]}">${x[0]}</div>`).join('')}</div><div id="msg" class="say" style="visibility:hidden"></div>`;
  const slots=[...document.querySelectorAll('.sl')];
  document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
   if(!d)return;
   if(d.id==='tr')d.appendChild(el);
   else if(d.classList.contains('sl')&&!d.firstChild)d.appendChild(el);
   else return;
   if(slots.every(s=>s.firstChild)){
    const ok=slots.every((s,k)=>+s.firstChild.dataset.i===k),m=$('#msg');m.style.visibility='visible';
    if(ok){slots.forEach(s=>s.classList.add('ok'));m.innerHTML=`✅ ${parts.join('')} — أحسنتِ!`;add(15);
     const b=document.createElement('button');b.className='btn';b.textContent=i==W.length-1?'إنهاء 🍯':'التالي ⬅';b.onclick=()=>{if(++i<W.length)show();else win(2,'ركّبتِ كل الكلمات بالضمّة!')};st.appendChild(b)}
    else{m.textContent='❌ حاولي مرة أخرى!';slots.forEach(s=>{bad(s);$('#tr').appendChild(s.firstChild)})}
   }
  }));
 }
 show();
}
/* المرحلة 3 */
function L3(){
 const D=['حُصِدَ','قُطِفَ','رُفِعَ','غُسِلَ','لُبِسَ','حُشِرَ'],F=['كَتَبَ','ذَهَبَ','فَتَحَ','جَلَسَ','رَكَضَ','سَمِعَ'];let n=0;
 const cards=shuf([...D.map(w=>[w,'d']),...F.map(w=>[w,'f'])]);
 st.innerHTML=`<h1>🧺 سلّتا العسل</h1><div class="say">اسحبي كل كلمة إلى سلّتها الصحيحة</div><div class="row"><div class="drop" data-k="d" style="min-width:150px;min-height:150px">🧺<small>تبدأ بضمّة ُ</small></div><div class="drop" data-k="f" style="min-width:150px;min-height:150px">🍯<small>تبدأ بفتحة َ</small></div></div><div class="tray">${cards.map(c=>`<div class="card w" data-k="${c[1]}">${c[0]}</div>`).join('')}</div>`;
 document.querySelectorAll('.card').forEach(c=>drag(c,(el,d)=>{
  if(d&&d.dataset.k===el.dataset.k){const t=document.createElement('small');t.textContent='✔ '+el.textContent;d.appendChild(t);d.classList.add('ok');el.remove();add(10);if(++n==12)setTimeout(()=>win(3,'وضعتِ كل الكلمات في سلّتها!'),400)}
  else bad(el);
 }));
}
menu();
</script>
</body>
</html>
